<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded square bg -->
  <rect width="32" height="32" rx="7.5" fill="#111118"/>

  <!--
    Clean F with a curved bottom-right tail:
    Matches the aesthetic of the OG preview image F logo
  -->
  <!-- Vertical stem -->
  <rect x="8" y="6" width="4" height="20" rx="2" fill="url(#g)"/>
  <!-- Top bar -->
  <rect x="8" y="6" width="16" height="4" rx="2" fill="url(#g)"/>
  <!-- Mid bar -->
  <rect x="8" y="14" width="11" height="4" rx="2" fill="url(#g)"/>
  <!-- Curved tail (sweep right at bottom, like the OG image F) -->
  <path d="M12 22 Q12 28 18 27.5 Q24 27 24 21 Q24 16.5 19 16.5 L12 17 L12 20" 
        stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>