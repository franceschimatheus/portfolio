<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matheus Franceschi | Senior Full-Stack Engineer</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Portfolio of Matheus Franceschi, Senior Full-Stack Engineer specializing in React, React Native, Node.js, Golang & Scalable Systems. Building high-impact platforms and cloud architecture." />
    <meta name="author" content="Matheus Franceschi" />
    <meta name="keywords" content="Matheus Franceschi, Senior Full-Stack Engineer, React Native, React, Node.js, Golang, Typescript, GCP, Cloud Architecture, Scalable Systems" />
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Prevent Theme Flash -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          // Default is always dark unless user explicitly chose light
          var isDark = stored ? stored === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#09090b] text-neutral-900 dark:text-neutral-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
